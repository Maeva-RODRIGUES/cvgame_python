# Publication de la version navigateur sur GitHub Pages.
# Se lance quand le workflow CI a réussi sur main : on ne publie jamais un code qui casse les tests.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write # publier sur GitHub Pages
  id-token: write # prouver à Pages que le déploiement vient bien de ce dépôt

# Un seul déploiement à la fois ; un nouveau push annule celui en attente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Le commit exact validé par la CI (sinon : dernier commit de main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer pygbag
        run: pip install -r requirements-dev.txt

      - name: Construire la version web
        run: python -m pygbag --build --title "Hack Ton Job - CV Game" .

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
